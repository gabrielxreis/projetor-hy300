  <rect width="1280" height="420" fill="url(#bg)"/>
  <g fill="#fff" opacity=".5"><circle cx="90" cy="60" r="1.5"/><circle cx="240" cy="330" r="1.2"/><circle cx="1150" cy="80" r="1.6"/><circle cx="1030" cy="360" r="1.2"/><circle cx="640" cy="30" r="1"/><circle cx="380" cy="80" r="1"/><circle cx="900" cy="40" r="1.3"/></g>
